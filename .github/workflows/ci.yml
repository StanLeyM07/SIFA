name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (test, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Smoke suites
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  backend:
    name: Backend (test, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Anti-hallucination guard suite
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
